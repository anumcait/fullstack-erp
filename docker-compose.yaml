version: '3.9'

services:
  # ────────────── DATABASE (PostgreSQL) ──────────────
  db:
    image: postgres:17
    container_name: hr_postgres
    environment:
      POSTGRES_DB:       hrdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./pg_restore:/pg_backup
      - hr_db_data:/var/lib/postgresql/data
      - ./init-scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrdb"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    shm_size: '256mb'
    ports:
      - "5432:5432"
    restart: always
    networks: [hr-network]
 
  # db:
