  # ────────────── BACKEND ──────────────
  backend:
    build:
      context: ./backend
    container_name: hr-backend
    env_file:
      - ./backend/.env.development
    depends_on:
      - db
    command: ["npx", "nodemon", "--legacy-watch", "index.js"]
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app           # <-- Mount your source code directory into container
      - /app/node_modules       # <-- Prevent overwriting node_modules inside container
    working_dir: /app            # <-- Set working directory to /app
    networks: [hr-network]
    restart: always

  # ────────────── FRONTEND ──────────────
  frontend:
    build:
      context: ./frontend
    container_name: hr-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks: [hr-network]
    restart: unless-stopped

# ────────────── Networks & Volumes ──────────────
networks:
  hr-network:
    driver: bridge

