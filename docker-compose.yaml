  # ────────────── JENKINS (CI/CD) ──────────────
  # jenkins:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.jenkins
  #   container_name: hr-jenkins
  #   user: root
  #   ports:
  #     - "8085:8080"
  #     - "50000:50000"
  #   volumes:
  #     - ./jenkins_data:/var/jenkins_home
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - .:/workspace
  #     # - /d/Fullstack-hr-app:/var/jenkins_home/workspace/fullstack-hr-pipeline
  #   networks: [hr-network]
  #   restart: unless-stopped

  # ────────────── BACKEND ──────────────
  backend:
    build:
      context: ./backend
    container_name: hr-backend
    env_file:
      - ./backend/.env.development
    environment:
      - PYTHON_AGENT_URL=http://agent_python:8001/process
    depends_on:
      db:
        condition: service_healthy
      agent_python:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 300s
    command: ["node", "index.js"]
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    working_dir: /app
    networks: [hr-network]
    restart: on-failure

  # ────────────── PYTHON AGENT ──────────────
  agent_python:
    build:
      context: ./agent_python
    container_name: hr-python-agent
    volumes:
      - ./agent_python:/app
    ports:
      - "8001:8001"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks: [hr-network]
    restart: always

  # ────────────── FRONTEND ──────────────
  frontend:
    build:
      context: ./frontend
    container_name: hr-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_TARGET=http://backend:5000
    ports:
      - "5173:5173"
    networks: [hr-network]
    restart: always

  nginx:
    image: nginx:latest
    container_name: hr-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro          # ✅ Mount file correctly
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [hr-network]
    restart: always
# ────────────── Networks & Volumes ──────────────
networks:
  hr-network:
    driver: bridge

volumes:
  hr_db_data:

