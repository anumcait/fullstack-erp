version: '3.9'

services:
  # ────────────── DATABASE (PostgreSQL) ──────────────
  db:
    image: postgres:17
    container_name: hr_postgres
    environment:
      POSTGRES_DB:       hrdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./pg_restore:/pg_backup
      - ./pgdata-new:/var/lib/postgresql/data
      - ./init-scripts/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hrdb && psql -U postgres -d hrdb -c 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

    ports:
      - "5432:5432"
    restart: unless-stopped
    networks: [hr-network]
 
