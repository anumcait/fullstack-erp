name: Build & Deploy to ECR

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 888577063211.dkr.ecr.us-east-1.amazonaws.com
  EC2_INSTANCE_ID: i-0f6326b130e915c8b

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t $ECR_REGISTRY/erp-backend:latest -t $ECR_REGISTRY/erp-backend:${{ github.sha }} backend/
          docker push $ECR_REGISTRY/erp-backend:latest
          docker push $ECR_REGISTRY/erp-backend:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build -t $ECR_REGISTRY/erp-frontend:latest -t $ECR_REGISTRY/erp-frontend:${{ github.sha }} frontend/
          docker push $ECR_REGISTRY/erp-frontend:latest
          docker push $ECR_REGISTRY/erp-frontend:${{ github.sha }}

      - name: Build & push agent
        run: |
          docker build -t $ECR_REGISTRY/erp-agent:latest -t $ECR_REGISTRY/erp-agent:${{ github.sha }} agent_python/
          docker push $ECR_REGISTRY/erp-agent:latest
          docker push $ECR_REGISTRY/erp-agent:${{ github.sha }}

      - name: Restart EC2 compose stack via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-id "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "aws ecr get-login-password --region '$AWS_REGION' | docker login --username AWS --password-stdin '$ECR_REGISTRY'",
              "cd /opt/erp-app && ECR_REGISTRY='$ECR_REGISTRY' docker compose -f docker-compose.demo.yaml pull",
              "systemctl restart erp-demo.service"
            ]' \
            --output text --query Command.CommandId)
          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent \
            --output text || echo "Check SSM console for output"
