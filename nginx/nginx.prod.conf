# Production nginx config for a standalone server (non-Docker-Compose hostnames).
# Serve the built frontend from /app (or /usr/share/nginx/html) and proxy API
# calls to the backend on the same host.

events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  server_tokens off;

  server {
    listen 80;
    server_name _;                 # change to your domain if you have one

    root /usr/share/nginx/html;    # <-- where you copy frontend/dist contents
    index index.html;

    client_max_body_size 20m;

    # Frontend (SPA) — history fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API -> backend (same host, default port 5000)
    location /api/ {
      proxy_pass http://127.0.0.1:5000;            # keep "/api" prefix (backend mounts /api)
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_read_timeout 300;
      proxy_send_timeout 300;
    }

    # Static uploads served by backend via /api
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
      access_log off;
    }

    # Redirect HTTP -> HTTPS (uncomment if you add TLS below)
    # if ($scheme = http) { return 301 https://$host$request_uri; }
  }
}
