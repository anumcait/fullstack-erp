events {}

http {
  # Docker's embedded DNS resolver (re-resolves upstreams per request so a
  # recreated container's new IP is picked up without restarting nginx).
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    location / {
      set $upstream_frontend http://frontend:5173;
      proxy_pass $upstream_frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
      set $upstream_backend http://backend:5000;
      proxy_pass $upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Backend health/status endpoints (no /api prefix) for quick checks.
    location = /db-status {
      set $upstream_backend http://backend:5000;
      proxy_pass $upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location = /metrics {
      set $upstream_backend http://backend:5000;
      proxy_pass $upstream_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
